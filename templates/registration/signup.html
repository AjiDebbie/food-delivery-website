{%include 'registration/base.html'%}
{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Hut</title>

    <!-- font awesome cdn link  -->
    <script src="https://kit.fontawesome.com/e4bf377e92.js" crossorigin="anonymous"></script>

    <!-- custom css file link  -->
    <link rel="stylesheet" href="{%static 'css/style.css' %}">
    
    <link rel="icon" href="{%static 'image/favicon.png' %}">

</head>
<body>



    <a href="/home/" class="logo"> <i class="fas fa-utensils"></i> foodHut </a>    


<!-- login-form  -->

<div class="login-form-container">

   {%block content %}


    <form method="POST">
        <h3>{{title}}</h3>
        {%csrf_token%}

        {{form.as_p}}
        
        <div class="remember">
            <input type="checkbox" name="" id="remember-me">
            <label for="remember-me">remember me</label>
        </div>
        <input type="submit" value="login now" class="btn">
        
        
         
        <p>already have an account? <a href="/accounts/login">click here</a></p>
    </form> 
    
     

{%endblock%}

</div>
</html>

</body>
